<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Innovation Intelligence Engine</title>
  <desc id="desc">A layered repository intelligence pipeline.</desc>
  <defs>
