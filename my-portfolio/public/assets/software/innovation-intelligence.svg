    <rect x="72" y="245" width="210" height="112" rx="20" fill="#fff" stroke="#dadce0"/><text x="177" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">600K+ repos</text><text x="177" y="323" text-anchor="middle" font-size="17" fill="#5f6368">ingestion</text>
    <rect x="350" y="245" width="210" height="112" rx="20" fill="#fff" stroke="#dadce0"/><text x="455" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">Canonicalize</text><text x="455" y="323" text-anchor="middle" font-size="17" fill="#5f6368">deduplicate</text>
    <rect x="628" y="245" width="210" height="112" rx="20" fill="#fff" stroke="#dadce0"/><text x="733" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">T0–T4 filters</text><text x="733" y="323" text-anchor="middle" font-size="17" fill="#5f6368">cost control</text>
    <rect x="906" y="245" width="210" height="112" rx="20" fill="#fff" stroke="#dadce0"/><text x="1011" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">55+ systems</text><text x="1011" y="323" text-anchor="middle" font-size="17" fill="#5f6368">deep review</text>
