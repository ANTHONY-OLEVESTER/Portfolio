    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a73e8" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <g opacity=".35" stroke="#d5e3ff"><path d="M0 110h1200M0 220h1200M0 330h1200M0 440h1200M0 550h1200"/><path d="M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675"/></g>
  <text x="72" y="92" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#1a73e8">INTERNET-SCALE INTELLIGENCE</text>
  <text x="72" y="145" font-family="Inter,Arial" font-size="44" font-weight="800" fill="#202124">Innovation Intelligence Engine</text>
